<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180c0e"/>
      <stop offset="100%" stop-color="#080405"/>
    </linearGradient>
    <linearGradient id="favGrad" gradientUnits="userSpaceOnUse" x1="16" y1="22" x2="84" y2="80">
      <stop offset="0%" stop-color="#ff5a6e"/>
      <stop offset="50%" stop-color="#ff3350"/>
      <stop offset="100%" stop-color="#c81e34"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded terminal-window background -->
  <rect width="512" height="512" rx="120" fill="url(#favBg)"/>
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="#3a1d1d" stroke-width="4"/>

  <!-- Prompt chevron + cursor block -->
  <g transform="translate(86,83) scale(3.4)">
    <path fill="none" stroke="url(#favGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
      d="M22,28 L50,50 L22,72"/>
    <rect x="58" y="64" width="26" height="16" rx="8" fill="url(#favGrad)"/>
  </g>
</svg>
