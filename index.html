<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diino's Toolbox — one terminal, every tool</title>
<meta name="description" content="Diino's Toolbox: a single Windows terminal for everything you'd otherwise hunt across ten apps for. One keypress, no mouse.">

<!-- Open Graph -->
<meta property="og:title" content="Diino's Toolbox">
<meta property="og:description" content="One terminal. Every tool. Single keypress, zero friction.">
<meta property="og:image" content="assets/poster.jpg">
<meta property="og:type" content="website">

<link rel="icon" id="favicon" type="image/svg+xml" href="favicon.svg">
<link rel="shortcut icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

<!-- scanline / grain overlay -->
<div class="crt-overlay" aria-hidden="true"></div>
<div class="vignette" aria-hidden="true"></div>

<!-- ambient braille heartagram sigil, drawn in JS -->
<canvas id="sigil" aria-hidden="true"></canvas>

<main>

  <section class="hero" id="hero">

    <div class="termbar">
      <div class="termbar-dots">
        <span></span><span></span><span></span>
      </div>
      <div class="termbar-title">diino@toolbox:~$ ./run</div>
      <div class="termbar-status" id="termStatus">BOOTING…</div>
    </div>

    <div class="video-frame">
      <video
        id="introVideo"
        muted
        playsinline
        preload="auto"
        poster="assets/poster.jpg">
        <source src="assets/intro.mp4" type="video/mp4">
      </video>
      <div class="video-dim" id="videoDim" aria-hidden="true"></div>
      <div class="scan" aria-hidden="true"></div>
    </div>

    <div class="hero-content" id="heroContent">

      <p class="eyebrow" id="eyebrow"><span class="blink">█</span> press any key to continue</p>

      <h1 class="title" aria-label="Diino's Toolbox">
        <span class="title-text">Diino's Toolbox</span>
      </h1>

      <p class="tagline">One terminal. Every tool. No mouse required.</p>

      <a href="#" class="dl-btn" id="downloadBtn" data-cdn="https://www.dropbox.com/scl/fi/k3k8opcq4ldshyg7il5nx/diinos-toolbox-installer.exe?rlkey=8w5qzk4jnl25se82jbictmaur&st=scxz6z6x&dl=1">
        <span class="dl-key">[ENTER]</span>
        <span class="dl-label">Download Diino's Toolbox</span>
        <span class="dl-meta">.exe · Windows · v1.0</span>
      </a>

      <p class="foot-line">diino<span class="fp-dot">■</span>toolbox — built for Windows Terminal</p>

    </div>

  </section>

</main>

<script src="script.js?v=2"></script>
</body>
</html>
